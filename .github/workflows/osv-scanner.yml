name: OSV-Scanner

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read

jobs:
  scan-pr:
    permissions:
      actions: read # required to upload SARIF
      security-events: write # upload results to the Security tab
      contents: read # read uv.lock
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      scan-args: |-
        --lockfile=./uv.lock
