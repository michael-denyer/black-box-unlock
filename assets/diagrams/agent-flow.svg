<text x="60" y="108" fill="#b6cbdd" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Query evidence before reading or editing. Use the post-edit coupling warning and request a fresh review explicitly.</text>
