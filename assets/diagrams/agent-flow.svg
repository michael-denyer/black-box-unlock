<text x="815" y="449" fill="#ffca58" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Warnings</text>
<path d="M1115 485H1435L1450 500V600L1435 615H1115L1100 600V500Z" fill="#0c2136" stroke="#ffca58" stroke-width="2"/>
<text x="1124" y="524" fill="#f4f8ff" font-family="DejaVu Sans Mono, monospace" font-size="26" font-weight="700" text-anchor="start">review_change</text>
<text x="1124" y="565" fill="#b6cbdd" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Fresh query: 0–3 checks</text>
<text x="1124" y="592" fill="#b6cbdd" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Renames retain history</text>
<path d="M925 335H1020V435H1275V483" fill="none" stroke="#ffca58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber-arrow)"/>
<text x="1275" y="423" fill="#ffca58" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Explicit MCP tool call</text>
<text x="60" y="681" fill="#b6cbdd" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Six signal tools share a process cache. xray_file runs per call. review_change always re-reads the selected change.</text>
