<text x="599" y="219" fill="#f4f8ff" font-family="DejaVu Sans Mono, monospace" font-size="29" font-weight="700" text-anchor="start">bbu-mcp [1b]</text>
<text x="599" y="268" fill="#b6cbdd" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Hotspots + file forensics</text>
<text x="599" y="303" fill="#b6cbdd" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Coupling + ownership + CI</text>
<text x="599" y="338" fill="#b6cbdd" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Per-call function X-Ray</text>
