<text x="74" y="582" fill="#b6cbdd" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Focus on the strongest signals</text>
<path d="M225 380V483" fill="none" stroke="#47e4ef" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cyan-arrow)"/>
<path d="M590 485H910L925 500V600L910 615H590L575 600V500Z" fill="#0c2136" stroke="#ffca58" stroke-width="2"/>
<text x="599" y="524" fill="#f4f8ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">Coupling guard [1c]</text>
<text x="599" y="582" fill="#b6cbdd" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Warns about companion files</text>
