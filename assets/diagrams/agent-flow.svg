<text x="1124" y="219" fill="#f4f8ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start">Repository evidence</text>
<text x="1124" y="268" fill="#b6cbdd" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Git history + current code</text>
<text x="1124" y="304" fill="#b6cbdd" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Optional GitHub Actions</text>
