<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
<title id="title">How the coding agent uses bbu-mcp</title>
<desc id="desc">Query evidence before reading or editing. Use the post-edit coupling warning and request a fresh review explicitly.</desc>
