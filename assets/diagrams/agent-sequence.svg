<text x="60" y="1138" fill="#b6cbdd" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Review resolves .bbu.toml, selects the change, and adds its own renames to the rename-following history before fresh analysis. CI is opt-in.</text>
