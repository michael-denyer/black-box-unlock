#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.4.11"

[[repos]]
repo = "builtin"
hooks = [
  {
    id = "trailing-whitespace",
    args = ["--markdown-linebreak-ext=md"]
  },
  { id = "end-of-file-fixer" },
  {
    id = "check-added-large-files",
    args = ["--maxkb=2048"]
  },
  { id = "check-case-conflict" },
  { id = "check-illegal-windows-names" },
  {
    id = "check-merge-conflict",
    args = ["--assume-in-merge"]
  },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-symlinks" },
  { id = "destroyed-symlinks" },
  { id = "fix-byte-order-marker" },
  { id = "forbid-new-submodules" },
  { id = "detect-private-key" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-executables-have-shebangs" },
  { id = "no-commit-to-branch" }
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.22"
hooks = [
  {
    id = "ruff",
    args = ["--fix"]
  },
  { id = "ruff-format" }
]

[[repos]]
repo = "https://github.com/DavidAnson/markdownlint-cli2"
rev = "v0.22.1"
hooks = [{ id = "markdownlint-cli2" }]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [{ id = "actionlint" }]

[[repos]]
repo = "https://github.com/lycheeverse/lychee"
# Pinned to the unreleased upstream fix for lycheeverse/lychee#2292: the hook
# script in lychee-v0.24.2 inherits GIT_DIR from git in a linked worktree and
# reads this repository's tags instead of its own, so every commit from a
# worktree fails with exit 100. A commit rev carries no version, hence
# LYCHEE_VERSION. Return to a release tag once one newer than 0.24.2 ships.
rev = "81cb43e138041299105cdeb84c70e66a137fa1bf"
hooks = [
  {
    id = "lychee",
    args = [
      "LYCHEE_VERSION=0.24.2",
      "--no-progress",
      "--max-retries",
      "3",
      "--timeout",
      "20"
    ],
    types = ["markdown"]
  }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "uv-lock-check",
    name = "uv lock is current",
    language = "system",
    entry = "uv lock --check",
    files = '^(pyproject\.toml|uv\.lock)$',
    pass_filenames = false
  },
  {
    id = "pyrefly",
    name = "pyrefly (production types)",
    language = "system",
    entry = "uv run pyrefly check",
    files = '^(src/.*\.py|pyproject\.toml)$',
    pass_filenames = false
  },
  {
    id = "zizmor",
    name = "zizmor (GitHub Actions security)",
    language = "system",
    entry = "uv run zizmor --offline --persona=regular .",
    files = '^\.github/(workflows/.*\.ya?ml|dependabot\.ya?ml)$',
    pass_filenames = false
  },
  {
    id = "uv-audit",
    name = "uv audit (locked dependencies)",
    language = "system",
    entry = "uv audit --locked --preview-features audit-command",
    files = '^(pyproject\.toml|uv\.lock)$',
    pass_filenames = false
  },
  {
    id = "maid",
    name = "maid (mermaid syntax)",
    language = "node",
    additional_dependencies = ["@probelabs/maid@0.0.29"],
    # maid validates only its first file argument, so call it once per file.
    entry = """bash -c 'rc=0; for f in "$@"; do maid "$f" || rc=1; done; exit $rc' --""",
    types = ["markdown"]
  },
  {
    id = "mmdc",
    name = "mmdc (mermaid renderer parity)",
    language = "node",
    additional_dependencies = [
      "@mermaid-js/mermaid-cli@11.15.0",
      "puppeteer@24"
    ],
    entry = """bash -c 'set -e; for f in "$@"; do mmdc -i "$f" -o /tmp/mmdc-validate.md; done' --""",
    types = ["markdown"]
  }
]
